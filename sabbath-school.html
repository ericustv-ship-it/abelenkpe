<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sabbath School Class</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #e5e7eb;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
      --radius: 16px;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .topbar, .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    h1 { font-size: 1.7rem; }
    h3 { margin-bottom: 8px; }

    .muted { color: var(--muted); }

    .btn {
      border: none;
      padding: 11px 15px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-light { background: #eef2ff; color: #1e3a8a; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .value {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 6px;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .field input {
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 170px;
    }

    .classes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .leader-box {
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .leader-title {
      font-weight: 800;
      color: #166534;
      margin-bottom: 8px;
    }

    .leader-name {
      font-weight: 800;
      color: #064e3b;
      font-size: 1rem;
    }

    .no-leader {
      background: #fee2e2;
      border-color: #fecaca;
    }

    .no-leader .leader-title,
    .no-leader .leader-name {
      color: #991b1b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 0.92rem;
    }

    th {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .leader-row {
      background: #f0fdf4;
      font-weight: 700;
    }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .male { background: #dbeafe; color: #1d4ed8; }
    .female { background: #fce7f3; color: #be185d; }
    .other { background: #e5e7eb; color: #374151; }
    .leader-role { background: #dcfce7; color: #166534; }
    .member-role { background: #eef2ff; color: #1e3a8a; }

    @media(max-width: 900px) {
      .stats, .classes-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      .topbar, .controls { display: none; }
      body { background: #fff; }
      .card {
        box-shadow: none;
        border: 1px solid #000;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div>
      <h1>Sabbath School Class</h1>
      <p class="muted">Members assigned to discussion leaders based on Sabbath School class names.</p>
    </div>

    <div>
      <a href="main.html" class="btn btn-light">Back</a>
      <button class="btn btn-primary" onclick="window.print()">Print</button>
    </div>
  </div>

  <section class="stats">
    <div class="card">
      <p class="muted">Total Members</p>
      <div class="value" id="totalMembers">0</div>
    </div>

    <div class="card">
      <p class="muted">Male Members</p>
      <div class="value" id="totalMales">0</div>
    </div>

    <div class="card">
      <p class="muted">Female Members</p>
      <div class="value" id="totalFemales">0</div>
    </div>

    <div class="card">
      <p class="muted">Sabbath Classes</p>
      <div class="value" id="totalClasses">0</div>
    </div>
  </section>

  <div class="card controls">
    <div class="field">
      <label>Class Year</label>
      <input type="number" id="classYear" min="2020" />
    </div>

    <div>
      <button class="btn btn-success" onclick="generateClasses()">Generate / Save Year Classes</button>
      <button class="btn btn-primary" onclick="loadYearClasses()">Load Year Classes</button>
      <button class="btn btn-danger" onclick="clearYearClasses()">Clear This Year</button>
    </div>
  </div>

  <div id="classContainer" class="classes-grid"></div>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Shared Supabase Configuration -->
  <script src="supabase-config.js"></script>

  <script>
    // Reuse the shared Supabase client initialized by supabase-config.js.
    // Do not declare a top-level variable named "supabase": the Supabase CDN
    // already exposes that global name.
    const churchSupabase = window.supabaseClient || null;

    let members = [];
    let generatedClasses = [];
    let isAdminLoggedIn = false;

    const currentYear = new Date().getFullYear();
    const yearInput = document.getElementById('classYear');
    const container = document.getElementById('classContainer');

    yearInput.value = currentYear;

    function getSelectedYear() {
      return Number(yearInput.value) || currentYear;
    }

    function getStorageKey() {
      return `sabbath_school_classes_${getSelectedYear()}`;
    }

    function cleanText(value) {
      return String(value ?? '').toLowerCase().replace(/\s+/g, ' ').trim();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character]));
    }

    function mapMember(row) {
      return {
        id: row.id,
        fullName: row.full_name || '',
        memberNumber: row.member_number || '',
        gender: row.gender || '',
        // Supabase column is member_class; the page uses memberClass.
        memberClass: row.member_class || '',
        dob: row.dob || '',
        phone: row.phone || '',
        note: row.note || ''
      };
    }

    function isDiscussionLeader(member) {
      return cleanText(member.note) === 'discussion leader';
    }

    function getGenderClass(gender) {
      const value = cleanText(gender);
      if (value === 'male') return 'male';
      if (value === 'female') return 'female';
      return 'other';
    }

    async function verifyAdminAccess() {
      if (!churchSupabase) {
        throw new Error('Supabase is not connected. Check supabase-config.js and the Supabase library.');
      }

      const { data: sessionData, error: sessionError } = await churchSupabase.auth.getSession();
      if (sessionError) throw sessionError;

      const user = sessionData?.session?.user;
      if (!user) {
        throw new Error('Please log in as an approved church administrator from the main page, then open Sabbath School Class again.');
      }

      const { data: profile, error: profileError } = await churchSupabase
        .from('profiles')
        .select('role, approval_status')
        .eq('id', user.id)
        .maybeSingle();

      if (profileError) throw profileError;

      if (profile?.role !== 'admin' || profile?.approval_status !== 'approved') {
        throw new Error('Approved administrator access is required to view registered members.');
      }

      isAdminLoggedIn = true;
      return true;
    }

    async function loadMembersFromSupabase() {
      await verifyAdminAccess();

      const { data, error } = await churchSupabase
        .from('members')
        .select('id, full_name, member_number, gender, member_class, dob, phone, note')
        .eq('is_active', true)
        .order('full_name', { ascending: true });

      if (error) throw error;

      members = (data || []).map(mapMember);
      renderStats();
    }

    function loadYearClasses() {
      try {
        generatedClasses = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
        if (!Array.isArray(generatedClasses)) generatedClasses = [];
      } catch (error) {
        console.error('Could not read saved Sabbath School classes:', error);
        generatedClasses = [];
      }
      renderClasses();
    }

    function shuffleArray(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function generateClasses() {
      if (!members.length) {
        alert('No active registered members were found in Supabase.');
        return;
      }

      // Members from ALL original Sabbath School classes are pooled together.
      // Discussion leaders remain fixed; ordinary members are reshuffled
      // across all leader groups whenever Generate is clicked.
      const leaders = members
        .filter(member => isDiscussionLeader(member))
        .sort((a, b) => String(a.fullName || '').localeCompare(String(b.fullName || '')));

      const ordinaryMembers = members.filter(member => !isDiscussionLeader(member));

      if (!leaders.length) {
        alert('No discussion leaders found. Set the Note field to DISCUSSION LEADER for each leader, then try again.');
        return;
      }

      const shuffledMembers = shuffleArray(ordinaryMembers);

      const leaderGroups = leaders.map((leader, index) => ({
        className: `Sabbath School Group ${index + 1}`,
        groupName: `Sabbath School Group ${index + 1} - ${leader.fullName || 'Discussion Leader'}`,
        leaderId: leader.id,
        leaders: [{
          id: leader.id,
          fullName: leader.fullName,
          serial: leader.memberNumber || 'N/A',
          gender: leader.gender || 'N/A',
          phone: leader.phone || 'N/A'
        }],
        members: [{
          id: leader.id,
          fullName: leader.fullName,
          memberNumber: leader.memberNumber,
          gender: leader.gender,
          phone: leader.phone,
          role: 'Discussion Leader'
        }]
      }));

      // Deal the pooled members round-robin to keep group sizes balanced.
      shuffledMembers.forEach((member, index) => {
        leaderGroups[index % leaderGroups.length].members.push({
          id: member.id,
          fullName: member.fullName,
          memberNumber: member.memberNumber,
          gender: member.gender,
          phone: member.phone,
          role: 'Member',
          originalClass: member.memberClass || ''
        });
      });

      generatedClasses = leaderGroups.map(group => {
        const leader = group.members[0];
        const ordinary = group.members.slice(1).sort((a, b) =>
          String(a.fullName || '').localeCompare(String(b.fullName || ''))
        );
        return { ...group, members: [leader, ...ordinary] };
      });

      try {
        localStorage.setItem(getStorageKey(), JSON.stringify(generatedClasses));
      } catch (error) {
        alert('Classes were generated but could not be saved in this browser: ' + error.message);
        renderClasses();
        return;
      }

      renderClasses();

      alert(
        `New Sabbath School groups generated successfully for ${getSelectedYear()}.\n` +
        `${leaders.length} discussion leader group(s) created.\n` +
        `${ordinaryMembers.length} ordinary member(s) from all registered classes were reshuffled.\n` +
        `Discussion leaders remained fixed.`
      );
    }

    function clearYearClasses() {
      if (!confirm(`Clear the saved Sabbath School class arrangement for ${getSelectedYear()}?`)) return;

      localStorage.removeItem(getStorageKey());
      generatedClasses = [];
      renderClasses();
    }

    function renderStats() {
      const males = members.filter(member => cleanText(member.gender) === 'male').length;
      const females = members.filter(member => cleanText(member.gender) === 'female').length;
      const classCount = new Set(
        members.map(member => cleanText(member.memberClass)).filter(Boolean)
      ).size;

      document.getElementById('totalMembers').textContent = members.length;
      document.getElementById('totalMales').textContent = males;
      document.getElementById('totalFemales').textContent = females;
      document.getElementById('totalClasses').textContent = classCount;
    }

    function renderLeaderBox(leaders) {
      if (!leaders || !leaders.length) {
        return `
          <div class="leader-box no-leader">
            <div class="leader-title">Discussion Leader</div>
            <div class="leader-name">No discussion leader assigned for this class</div>
          </div>
        `;
      }

      return `
        <div class="leader-box">
          <div class="leader-title">Discussion Leader(s)</div>
          <div class="leader-name">
            ${leaders.map(leader =>
              `${escapeHtml(leader.fullName)} (${escapeHtml(leader.serial)})`
            ).join(', ')}
          </div>
        </div>
      `;
    }

    function renderClasses() {
      renderStats();

      if (!generatedClasses.length) {
        container.innerHTML = `
          <div class="card">
            <p class="muted">
              No saved class arrangement found for ${getSelectedYear()}.
              Click “Generate / Save Year Classes” to create the arrangement from members' registered Sabbath School classes.
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = generatedClasses.map(group => {
        const groupMembers = Array.isArray(group.members) ? group.members : [];
        const maleCount = groupMembers.filter(member => cleanText(member.gender) === 'male').length;
        const femaleCount = groupMembers.filter(member => cleanText(member.gender) === 'female').length;

        return `
          <div class="card">
            <h3>${escapeHtml(group.groupName || group.className)}</h3>
            ${renderLeaderBox(group.leaders)}

            <p class="muted">
              Year: ${getSelectedYear()} |
              Total Assigned: ${groupMembers.length} |
              Male: ${maleCount} |
              Female: ${femaleCount}
            </p>

            <table>
              <thead>
                <tr>
                  <th>No.</th>
                  <th>Name</th>
                  <th>Serial</th>
                  <th>Gender</th>
                  <th>Phone</th>
                  <th>Role</th>
                </tr>
              </thead>
              <tbody>
                ${groupMembers.map((member, index) => {
                  const leader = member.role === 'Discussion Leader';
                  return `
                    <tr class="${leader ? 'leader-row' : ''}">
                      <td>${index + 1}</td>
                      <td>${escapeHtml(member.fullName || 'N/A')}</td>
                      <td>${escapeHtml(member.memberNumber || member.serial || 'N/A')}</td>
                      <td>
                        <span class="pill ${getGenderClass(member.gender)}">
                          ${escapeHtml(member.gender || 'N/A')}
                        </span>
                      </td>
                      <td>${escapeHtml(member.phone || 'N/A')}</td>
                      <td>
                        <span class="pill ${leader ? 'leader-role' : 'member-role'}">
                          ${leader ? 'Discussion Leader' : 'Member'}
                        </span>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }).join('');
    }

    async function initializeSabbathSchool() {
      container.innerHTML = '<div class="card"><p class="muted">Loading registered members from Supabase...</p></div>';

      try {
        await loadMembersFromSupabase();
        loadYearClasses();
      } catch (error) {
        console.error('Sabbath School loading error:', error);
        container.innerHTML = `
          <div class="card">
            <h3>Unable to load Sabbath School members</h3>
            <p class="muted">${escapeHtml(error.message || 'An unexpected error occurred.')}</p>
            <p class="muted" style="margin-top:8px;">
              Return to the main church page, sign in with an approved administrator account, and reopen this page.
            </p>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="initializeSabbathSchool()">
              Try Again
            </button>
          </div>
        `;
        renderStats();
      }
    }

    document.getElementById('classYear').addEventListener('change', loadYearClasses);

    // Refresh registered members from Supabase before generating a new arrangement.
    document.querySelector('.btn-success').addEventListener('click', async () => {
      const button = document.querySelector('.btn-success');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = 'Loading members...';

      try {
        await loadMembersFromSupabase();
        generateClasses();
      } catch (error) {
        alert('Could not refresh members from Supabase: ' + error.message);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    });

    // The HTML button has an inline onclick. Remove it so the async handler above
    // is the only Generate handler and does not run twice.
    document.querySelector('.btn-success').removeAttribute('onclick');

    window.initializeSabbathSchool = initializeSabbathSchool;
    initializeSabbathSchool();
  </script>

</body>
</html>
